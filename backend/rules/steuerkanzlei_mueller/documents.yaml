# Document catalog for a single firm (proxy ruleset — a realistic stand-in).
#
# Each document is an entity referenced by id from rules.yaml. It carries its own
# metadata (label, group) plus two "do-not-foreclose" flags that the prototype
# engine CARRIES BUT DOES NOT ENFORCE:
#   - multi_instance: a document may exist in N instances (e.g. one wage cert per
#     employer/year). The prototype emits one line per id; it never expands instances.
#   - instance_scope: "all" | "sample" — whether all instances or a sample are needed.
#     Carried on the entity so the data model isn't blocked later; unused in prototype logic.
#
# Editing note for the consultant: to rename a document change its `label`; to add
# a new document add a block with a fresh `id` and reference that id from a rule.

firm: steuerkanzlei_mueller

documents:
